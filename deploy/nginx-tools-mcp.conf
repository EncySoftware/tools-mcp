# The hosted tools-mcp behind tools.encycam.com. Goes inside the site's server block
# (/etc/nginx/sites-enabled/tools.encycam.com), then: nginx -t && systemctl reload nginx

# A file's link: its random id is the credential, so neither log keeps the path.
location /mcp/files/ {
    proxy_pass http://127.0.0.1:8097;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    access_log off;
    error_log /dev/null;
}

# MCP Streamable HTTP: an answer may stream (progress), so nothing is buffered; a big build gets 15 minutes.
location /mcp {
    proxy_pass http://127.0.0.1:8097;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    access_log off;
}

# Where an MCP client learns to sign in (RFC 9728), with and without /mcp: no secret in it.
location /.well-known/oauth-protected-resource {
    proxy_pass http://127.0.0.1:8097;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}
